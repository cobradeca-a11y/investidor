services:
  fiia-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fiia-investidor:local
    container_name: fiia-investidor
    restart: unless-stopped
    environment:
      FIIA_API_KEY: ${FIIA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FIIA_ENV: ${FIIA_ENV:-prod}
      FIIA_DEBUG: ${FIIA_DEBUG:-0}
      FIIA_OBSERVABILIDADE: ${FIIA_OBSERVABILIDADE:-1}
      FIIA_DATA_DIR: /app/data
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "${FIIA_PORT:-8080}:8080"
    volumes:
      - fiia_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  fiia_data:
