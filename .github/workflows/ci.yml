name: CI FIIA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest requests yfinance
        
    - name: Check Python Syntax (compileall)
      run: python -m compileall .
      
    - name: Run Zero DB Query Mode Tests
      run: pytest teste_proibicao_sqlite.py teste_comparacao_motores.py teste_contrato_gates.py teste_contrato_decisao.py
